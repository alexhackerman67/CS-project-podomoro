 id="breathingPrompt">Ready to breathe?</p></div><div class="time" id="time" aria-live="off">25:00</div><div class="status" id="status">READY WHEN YOU ARE</div><div id="currentTask" class="current-task" aria-live="polite" hidden></div><div class="controls"><button class="start" id="start">▶ &nbsp; Let’s focus</button><button class="reset" id="reset" aria-label="Reset timer">↺</button><button class="settings-mini" id="settings" aria-label="Open sound settings" title="Settings">⚙</button></div><button class="back-to-focus" id="backToFocus" hidden>Back to focus</button><button class="focus-view-toggle" id="focusViewToggle" hidden>Show notebook</button></section><section class="tasks" aria-labelledby="tasksHeading"><div class="tasks-heading"><div><h2 id="tasksHeading">Study notebook</h2></div><span id="taskProgress" aria-live="polite">0 of 0 done</span></div><form id="taskForm" class="task-form"><input id="taskInput" placeholder="Add a task…" aria-label="New task" maxlength="100" required autocomplete="off"><button type="button" id="addTask" aria-label="Add task" title="Add task">+</button></form><ul id="taskList" class="task-list"></ul><p id="taskEmpty" class="task-empty"></p><button id="clearCompleted" class="clear-completed" hidden>Clear completed</button></section></div><div id="focusSummary" class="focus-summary">0 minutes focused today</div><div class="session"><span id="dots"></span><span id="sessions">0 sessions today</span></div></main><dialog id="prefs"><h2>Settings</h2><p class="settings-row"><label for="sound">Timer sounds</label><input id="sound" type="checkbox" role="switch" checked style="width:22px;height:22px;accent-color:#768668"></p><button id="closeSettings">Done</button></dialog><script>
const $=id=>document.getElementById(id);let mode='focus',minutes={focus:25,break:5},remaining=1500,running=false,end=0,sound=true;let saved;try{saved=JSON.parse(localStorage.getItem('lil-timer')||'{}')}catch{saved={}}let count=saved.date===new Date().toLocaleDateString()?saved.count||0:0;let taskSerial=0;
function newTaskId(){return 'task-'+Date.now().toString(36)+'-'+(++taskSerial)}
let tasks=Array.isArray(saved.tasks)?saved.tasks.filter(t=>t&&typeof t.text==='string').map(t=>({id:t.id||newTaskId(),text:t.text.slice(0,100),done:!!t.done})):saved.task&&typeof saved.task==='string'&&saved.task.trim()?[{id:newTaskId(),text:saved.task.trim().slice(0,100),done:false}]:[];
let activeTaskId=typeof saved.activeTaskId==='string'?saved.activeTaskId:null;
let progressDate=new Date().toLocaleDateString(),focusMs=saved.date===progressDate&&Number.isFinite(saved.focusMs)?Math.max(0,saved.focusMs):0,accountedAt=0,showWorkspace=false,lastTimerSave=0;
function persist(){try{localStorage.setItem('lil-timer',JSON.stringify({date:progressDate,count,tasks,activeTaskId,focusMs,sound,timer:{mode,minutes,remaining,running,end,accountedAt}}))}catch{}}
function accountTime(now=Date.now()){const date=new Date(now).toLocaleDateString();if(date!==progressDate){progressDate=date;count=0;focusMs=0}if(running&&mode==='focus'&&accountedAt){const midnight=new Date(now);midnight.setHours(0,0,0,0);focusMs+=Math.max(0,Math.min(now,end)-Math.max(accountedAt,midnight.getTime()))}if(running)accountedAt=Math.min(now,end)}

function renderCurrentTask(){const current=tasks.find(t=>t.id===activeTaskId&&!t.done),box=$('currentTask');box.replaceChildren();box.hidden=!current;if(current){const caption=document.createElement('small'),name=document.createElement('span');caption.textContent='WORKING ON';name.textContent=current.text;box.append(caption,name)}}
function moveTask(id,targetIndex){const index=tasks.findIndex(t=>t.id===id);if(index<0)return;targetIndex=Math.max(0,Math.min(tasks.length-1,targetIndex));if(index===targetIndex)return;const [task]=tasks.splice(index,1);tasks.splice(targetIndex,0,task);persist();renderTasks()}
function editTask(task,button){const input=document.createElement('input');input.className='task-edit';input.value=task.text;input.maxLength=100;input.setAttribute('aria-label','Edit task');button.replaceWith(input);input.focus();input.select();let finished=false;function finish(cancel){if(finished)return;finished=true;const value=input.value.trim();if(!cancel&&value)task.text=value;persist();renderTasks()}input.onblur=()=>finish(false);input.onkeydown=e=>{if(e.key==='Enter'||e.key==='Escape'){e.preventDefault();finish(e.key==='Escape')}}}
function renderTasks(){const list=$('taskList');list.replaceChildren();tasks.forEach((task,index)=>{const row=document.createElement('li');row.dataset.taskId=task.id;row.className='task-row'+(task.done?' completed':'')+(activeTaskId===task.id?' selected-task':'');const check=document.createElement('input'),text=document.createElement('button'),remove=document.createElement('button'),focus=document.createElement('button'),grip=document.createElement('button');check.type='checkbox';check.className='task-check';check.checked=task.done;check.setAttribute('aria-label','Complete '+task.text);check.onchange=()=>{task.done=check.checked;if(task.done){if(activeTaskId===task.id)activeTaskId=null;celebrate(check)}persist();renderTasks()};text.type='button';text.className='task-text-button';text.textContent=task.text;text.title='Click to edit';text.onclick=()=>editTask(task,text);remove.type='button';remove.className='task-delete';remove.textContent='×';remove.setAttribute('aria-label','Delete '+task.text);remove.onclick=()=>{tasks.splice(index,1);if(activeTaskId===task.id)activeTaskId=null;persist();renderTasks();$('taskInput').focus()};focus.type='button';focus.className='task-focus';focus.textContent='◉';focus.disabled=task.done;focus.title=activeTaskId===task.id?'Clear current task':'Work on this';focus.setAttribute('aria-label','Work on '+task.text);focus.setAttribute('aria-pressed',String(activeTaskId===task.id));focus.onclick=()=>{activeTaskId=activeTaskId===task.id?null:task.id;persist();renderTasks()};grip.type='button';grip.className='task-grip';grip.textContent='⋮⋮';grip.setAttribute('aria-label','Reorder '+task.text+' using drag or arrow keys');grip.onkeydown=e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();moveTask(task.id,index+(e.key==='ArrowUp'?-1:1));const moved=Array.from(list.children).find(r=>r.dataset.taskId===task.id);if(moved)moved.querySelector('.task-grip').focus()}};grip.onpointerdown=e=>{if(e.button!==undefined&&e.button!==0)return;e.preventDefault();const startY=e.clientY;let moved=false;row.classList.add('dragging');function drag(ev){if(Math.abs(ev.clientY-startY)>4)moved=true;const target=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('[data-task-id]');if(moved&&target&&target.dataset.taskId!==task.id){const targetIndex=tasks.findIndex(t=>t.id===target.dataset.taskId);moveTask(task.id,targetIndex)}}function end(){document.removeEventListener('pointermove',drag);document.removeEventListener('pointerup',end);document.removeEventListener('pointercancel',end);renderTasks()}document.addEventListener('pointermove',drag);document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end)};row.append(grip,check,text,focus,remove);list.append(row)});const completed=tasks.filter(t=>t.done).length;$('taskProgress').textContent=completed+' of '+tasks.length+' done';$('taskEmpty').hidden=tasks.length>0;$('clearCompleted').hidden=completed===0;renderCurrentTask()}
function addTask(){const input=$('taskInput'),text=input.value.trim();if(!text){input.focus();return}tasks.push({id:newTaskId(),text:text.slice(0,100),done:false});input.value='';persist();renderTasks();input.focus()}
$('addTask').onclick=e=>{e.preventDefault();addTask()};$('taskForm').onsubmit=e=>{e.preventDefault();addTask()};
let celebrationTimeout;
function celebrate(source){playSound('complete');const old=$('celebrationToast');if(old)old.remove();const toast=document.createElement('div');toast.id='celebrationToast';toast.className='celebration-toast';toast.setAttribute('role','status');toast.textContent='✓ One little win. Nice work!';document.body.append(toast);clearTimeout(celebrationTimeout);celebrationTimeout=setTimeout(()=>toast.remove(),1800);if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const box=source.getBoundingClientRect();for(let i=0;i<20;i++){const piece=document.createElement('i');piece.className='confetti-piece';piece.style.left=(box.left+box.width/2)+'px';piece.style.top=(box.top+box.height/2)+'px';piece.style.background=['#819273','#d9957a','#e2c676','#b8b99a'][i%4];piece.style.setProperty('--dx',((Math.random()-.5)*240)+'px');piece.style.setProperty('--dy',(-30-Math.random()*140)+'px');piece.style.setProperty('--spin',((Math.random()-.5)*600)+'deg');document.body.append(piece);setTimeout(()=>piece.remove(),1000)}}
$('clearCompleted').onclick=()=>{tasks=tasks.filter(t=>!t.done);persist();renderTasks()};renderTasks();
function draw(){const n=minutes[mode];$('marks').innerHTML=Array.from({length:29},(_,i)=>{let val=n+(i-14)*5,x=240+(i-14)*58,y=286-Math.pow((x-240)/180,2)*20;if(val<1||val>60)return '';return `<path d="M${x} ${y-18}v6" stroke="#8c493b" opacity=".65"/><text x="${x}" y="${y+3}" text-anchor="middle" fill="#753f34" font-size="19">${val>=1&&val<=60?val:''}</text>`}).join('');$('dial').setAttribute('aria-valuenow',n)}let breathState='';
function renderBreathing(){
 const isBreak=mode==='break',tomato=$('tomato');
 document.body.classList.toggle('break-view',isBreak);
 tomato.classList.toggle('holding-in',isBreak&&running&&((minutes.break*60-(end-Date.now())/1000)%16)>=4&&((minutes.break*60-(end-Date.now())/1000)%16)<8);
 $('breathingCopy').hidden=!isBreak;$('backToFocus').hidden=!isBreak;
 $('dial').setAttribute('tabindex',isBreak?'-1':'0');
 const state=mode+':'+running+':'+end;
 if(state!==breathState){
  const elapsed=running?Math.max(0,minutes.break*60-(end-Date.now())/1000):Math.max(0,minutes.break*60-remaining);
  tomato.style.setProperty('--breath-offset',-(elapsed%16)+'s');
  tomato.classList.toggle('is-breathing',isBreak&&running);
  breathState=state;
 }
 if(isBreak){
  const elapsed=running?Math.max(0,minutes.break*60-(end-Date.now())/1000):0;
  const phase=Math.floor((elapsed%16)/4), count=4-Math.floor(elapsed%4);
  const prompt=running?['Breathe in through your nose','Hold gently','Breathe out through your nose','Rest and hold'][phase]+' · '+count:(remaining<minutes.break*60?'Rest at your own pace':'Ready to breathe?');
  if($('breathingPrompt').textContent!==prompt)$('breathingPrompt').textContent=prompt;
 }
}
function render(){renderBreathing();document.body.classList.toggle('focus-view',running&&mode==='focus'&&!showWorkspace);$('focusViewToggle').hidden=!(running&&mode==='focus');$('focusViewToggle').textContent=showWorkspace?'Return to focus view':'Show notebook';$('focusSummary').textContent=Math.floor(focusMs/60000)+' minute'+(Math.floor(focusMs/60000)===1?'':'s')+' focused today';$('tomato').classList.toggle('is-running',running&&mode==='focus');$('mouth').setAttribute('d',running?'M230 170 Q240 185 250 170':'M232 172 Q240 172 248 172');$('time').textContent=`${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')}`;document.title=`${$('time').textContent} · Lil Timer`;$('start').textContent=running?'Ⅱ  Pause':remaining===minutes[mode]*60?(mode==='focus'?'▶  Let’s focus':'▶  Take a pause'):'▶  Continue';$('dots').innerHTML=Array.from({length:4},(_,i)=>`<i class="dot ${i<(count%4||(count?4:0))?'done':''}" style="display:inline-block;margin-right:5px"></i>`).join('');$('sessions').textContent=`${count} session${count===1?'':'s'} today`}function choose(m){accountTime();mode=m;running=false;end=0;accountedAt=0;showWorkspace=false;remaining=minutes[m]*60;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('selected',b.dataset.mode===m));$('status').textContent=m==='focus'?'READY WHEN YOU ARE':'A LITTLE TIME TO RECHARGE';draw();render();persist()}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>choose(b.dataset.mode));
$('start').onclick=()=>{updateTimer();if(running){accountTime();remaining=Math.max(0,Math.ceil((end-Date.now())/1000));running=false;$('status').textContent='TAKE YOUR TIME'}else{playSound('start');running=true;accountedAt=Date.now();end=accountedAt+remaining*1000;showWorkspace=false;$('status').textContent=mode==='focus'?'ONE THING AT A TIME':'BREATHE. STRETCH. UNWIND.'}render();persist()};$('reset').onclick=()=>choose(mode);$('backToFocus').onclick=()=>choose('focus');$('focusViewToggle').onclick=()=>{showWorkspace=!showWorkspace;render()};
let audioContext=null;
function unlockAudio(){if(!sound)return null;try{if(!audioContext)audioContext=new (window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});return audioContext}catch{return null}}
function playSound(kind){if(!sound)return;const a=unlockAudio();if(!a)return;const notes=kind==='tick'?[[920,0,.035]]:kind==='start'?[[392,0,.13],[523.25,.12,.23]]:kind==='complete'?[[659.25,0,.18],[783.99,.09,.2],[1046.5,.2,.4]]:[[523.25,0,.45],[659.25,.18,.45],[783.99,.36,.75]];for(const [frequency,delay,duration] of notes){const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;o.type=kind==='tick'?'triangle':'sine';o.frequency.setValueAtTime(frequency,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(kind==='tick'?.035:.09,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+duration+.02)}}
function chime(){playSound('finish')}
function updateTimer(){const now=Date.now();accountTime(now);if(running){remaining=Math.max(0,Math.ceil((end-now)/1000));if(!remaining){const finishedMode=mode,finishedAt=end;running=false;chime();if(finishedMode==='focus'){if(new Date(finishedAt).toLocaleDateString()===progressDate)count++;choose('break');$('status').textContent='NICE WORK. YOUR BREAK IS READY.'}else{choose('focus');$('status').textContent='WELCOME BACK. A FRESH LITTLE START.'}persist()}}render();if(now-lastTimerSave>=1000){persist();lastTimerSave=now}}
setInterval(updateTimer,200);
let dragging=false,startX,initial;function change(n){if(running)return;const next=Math.min(60,Math.max(5,n));if(next===minutes[mode])return;minutes[mode]=next;playSound('tick');remaining=minutes[mode]*60;draw();render();persist()}$('dial').onpointerdown=e=>{e.preventDefault();unlockAudio();if(running)return;dragging=true;startX=e.clientX;initial=minutes[mode];$('dial').setPointerCapture(e.pointerId)};$('dial').onpointermove=e=>{if(dragging)change(initial+Math.round((startX-e.clientX)/24)*5)};$('dial').onpointerup=()=>dragging=false;$('dial').onpointercancel=()=>dragging=false;$('dial').onkeydown=e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();change(minutes[mode]+(['ArrowRight','ArrowUp'].includes(e.key)?5:-5))}};function restoreTimer(){if(typeof saved.sound==='boolean')sound=saved.sound;const t=saved.timer;if(!t||!['focus','break'].includes(t.mode))return;mode=t.mode;for(const m of ['focus','break'])if(Number.isFinite(t.minutes?.[m]))minutes[m]=Math.min(60,Math.max(5,t.minutes[m]));remaining=Number.isFinite(t.remaining)?Math.max(0,Math.min(3600,t.remaining)):minutes[mode]*60;running=t.running===true&&Number.isFinite(t.end)&&Number.isFinite(t.accountedAt)&&t.accountedAt>0;end=running?t.end:0;accountedAt=running?t.accountedAt:0;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('selected',b.dataset.mode===mode));$('status').textContent=running?(mode==='focus'?'ONE THING AT A TIME':'BREATHE. STRETCH. UNWIND.'):'READY WHEN YOU ARE'}
document.addEventListener('visibilitychange',()=>{updateTimer();persist()});window.addEventListener('pagehide',()=>{accountTime();persist()});
$('settings').onclick=()=>{$('sound').checked=sound;$('prefs').showModal()};$('closeSettings').onclick=()=>$('prefs').close();$('sound').onchange=()=>{sound=$('sound').checked;if(sound)playSound('start');persist()};restoreTimer();draw();updateTimer();persist();
