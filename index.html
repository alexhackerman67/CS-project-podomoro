/* Keep the board within the viewport, including when the notebook opens. */
html{height:100%;overflow:hidden}body{height:100dvh;min-height:0;overflow:hidden;padding:24px 80px}
main,.focus-view main,.break-view main{height:min(760px,calc(100dvh - 48px));min-height:0;max-width:1080px;padding:24px 28px;display:flex;flex-direction:column;justify-content:center;overflow:auto;scrollbar-width:thin}
.app-title{flex-shrink:0;font-size:clamp(38px,6vh,58px)!important;margin-bottom:18px!important}
.workspace,.focus-view .workspace,.break-view .workspace{flex:1;min-height:0;align-content:center;margin:0 auto}
.timer-panel{min-height:0}.tomato{width:clamp(180px,calc((100dvh - 390px)*1.41),395px)}
.focus-view .tomato,.break-view .tomato{width:clamp(180px,calc((100dvh - 300px)*1.41),440px)}
.workspace .tasks{display:flex;flex-direction:column;min-height:0;max-height:100%;padding-top:24px;padding-bottom:24px}.focus-view .tasks,.break-view .tasks{display:none}
.task-list{min-height:94px;overflow-y:auto;max-height:280px;scrollbar-width:thin;overscroll-behavior:contain}.tasks-heading,.task-form{flex-shrink:0}
.focus-summary{flex-shrink:0;margin-top:12px}.session{flex-shrink:0;margin-top:6px}.controls{margin:12px 0}.focus-view-toggle{padding:6px 10px}
.tomato-splat{position:absolute;right:9px;top:48%;width:80px;height:70px;opacity:.15;transform:rotate(18deg);pointer-events:none}
@media(min-width:1450px){body{padding:24px 120px}.tomato-splat{right:calc((100vw - 1080px)/4 - 40px)}}
@media(max-width:760px){body{padding:12px;display:flex}main,.focus-view main,.break-view main{height:calc(100dvh - 24px);min-height:0;max-width:480px;padding:22px 18px;justify-content:flex-start}.workspace{flex:none;min-height:auto;gap:20px}.workspace .tasks{max-height:300px}.task-list{min-height:94px;max-height:160px}.tomato{width:270px}.focus-view .workspace,.break-view .workspace{flex:1;display:flex;align-items:center;justify-content:center}.focus-view .tomato,.break-view .tomato{width:min(350px,80vw)}}
@media(max-height:560px) and (min-width:761px){main,.focus-view main,.break-view main{justify-content:flex-start}.workspace,.focus-view .workspace,.break-view .workspace{flex:none;min-height:280px}.app-title{font-size:34px!important}.title-logo{width:38px;height:40px}.workspace .tasks{max-height:280px}}

/* Compact board; notebook dimensions never depend on task count. */
main,.focus-view main,.break-view main{height:min(690px,calc(100dvh - 48px));max-width:1000px;padding:22px 26px}
.workspace{gap:38px;max-width:848px}
.workspace .tasks{height:350px;min-height:350px;max-height:350px;overflow:hidden;flex-shrink:0}
.task-list{flex:1 1 0;min-height:0;max-height:none;overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable;overscroll-behavior:contain}
.clear-completed{flex:0 0 28px;min-height:28px;padding:8px 0 0;display:block}.clear-completed[hidden]{display:block;visibility:hidden;pointer-events:none}

@media(max-height:650px) and (min-width:761px){.workspace .tasks{height:280px;min-height:280px;max-height:280px;padding-top:18px;padding-bottom:18px}}

/* Sparse countertop marks and gently textured notebook paper. */
.small-splat{position:absolute;width:43px;height:39px;opacity:.14;pointer-events:none}.splat-clay{left:30px;top:43%;color:#b47761;transform:rotate(-24deg)}.splat-olive{right:22px;top:37%;width:31px;color:#89906a;transform:rotate(35deg)}.splat-ochre{left:48px;bottom:5%;width:35px;color:#b28a50;transform:rotate(12deg)}
.workspace .tasks{background:linear-gradient(90deg,#e4dccb 0,#f2ebdd 25px,#fffdf6 46px,#fffcf3 94%,#f2ead9 100%);border-color:#cfc2aa;border-radius:5px 13px 15px 5px;box-shadow:2px 3px 0 #fffaf0,3px 4px 0 #d0c4af,5px 6px 0 #faf3e4,6px 7px 0 #c7b89b,8px 9px 0 #e9ddc4,9px 11px 0 #ab9676,12px 17px 22px #62492d18,inset 1px 1px 0 #ffffffcc}
.tasks:before{background:#c68e794d;box-shadow:1px 0 0 #fff9ed}
.tasks:after{left:-8px;width:18px;background:radial-gradient(ellipse at 55% 50%,#827f70 0 2px,#b9baaa 2px 3px,#ede9da 3px 4px,#999b8a 4px 5px,transparent 5.5px) center top/18px 31px repeat-y;filter:drop-shadow(1px 1px 1px #645c4222)}
.task-list{background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 46px,#cfc7b655 46px,#cfc7b655 47px),repeating-linear-gradient(96deg,#a4916803 0,#a4916803 1px,transparent 1px,transparent 5px);background-attachment:local,local;background-origin:padding-box;scrollbar-color:#b8b69d transparent}
.task-row,.task-row:last-child{border-bottom:0}.task-row{min-height:47px}.tasks-heading h2{color:#504738}.task-form{background:#faf7ef;border-color:#ded4c2;box-shadow:inset 0 1px 3px #8c775510}

 418 220 Q405 305 240 315 Q83 308 62 219"/></clipPath><clipPath id="band"><path d="M61 218 Q240 274 419 218 L405 276 Q240 326 75 276Z"/></clipPath></defs><path d="M62 219 C37 105 116 65 187 70 Q240 53 294 70 C370 64 443 116 418 220 Q405 305 240 315 Q83 308 62 219" fill="url(#skin)"/><path d="M64 221 Q240 272 417 221 Q408 311 240 315 Q85 306 64 221" fill="url(#base)"/><path d="M64 219 Q240 270 417 219" fill="none" stroke="#af604a" stroke-width="2" opacity=".6"/><path d="M235 75 C199 92 181 76 170 67 Q202 67 205 54 Q186 43 197 35 Q219 35 234 54 Q240 26 254 25 Q267 40 257 55 Q285 39 301 53 Q285 69 264 70 Q290 83 279 93 Q252 93 241 77Z" fill="#73835d"/><path d="M242 58 Q241 34 251 24" stroke="#5d724d" stroke-width="6" fill="none" stroke-linecap="round"/><ellipse cx="138" cy="130" rx="21" ry="40" transform="rotate(36 138 130)" fill="#ffd8bb" opacity=".20"/><circle cx="218" cy="162" r="3.5" fill="#714a3c"/><circle cx="262" cy="162" r="3.5" fill="#714a3c"/><g class="breath-nose" aria-hidden="true"><path d="M237 166 Q240 162 243 166" fill="none" stroke="#98604b" stroke-width="2" stroke-linecap="round"/><g class="nose-air air-left"><path d="M199 193 Q220 192 236 169"/></g><g class="nose-air air-right"><path d="M281 193 Q260 192 244 169"/></g></g><path id="mouth" d="M232 172 Q240 172 248 172" stroke="#714a3c" stroke-width="2.5" fill="none" stroke-linecap="round"/><ellipse cx="204" cy="173" rx="10" ry="5" fill="#f5af93"/><ellipse cx="276" cy="173" rx="10" ry="5" fill="#f5af93"/><g clip-path="url(#tomato-outline)" class="dial" id="dial" role="slider" tabindex="0" aria-label="Study duration in minutes" aria-valuemin="5" aria-valuemax="60" aria-valuenow="25"><path d="M61 218 Q240 274 419 218 L405 276 Q240 326 75 276Z" fill="transparent"/><g clip-path="url(#band)" id="marks"></g><path d="M228 244 L252 244 L240 261Z" fill="#f9f5df" stroke="#b36550" stroke-width="1"/></g></svg></div><div class="hint">↔ Drag to set minutes</div><div class="breathing-copy" id="breathingCopy" hidden><p id="breathingPrompt">Ready to breathe?</p></div><div class="time" id="time" aria-live="off">25:00</div><div class="status" id="status">READY WHEN YOU ARE</div><div id="currentTask" class="current-task" aria-live="polite" hidden></div><div class="controls"><button class="start" id="start">▶ &nbsp; Let’s focus</button><button class="reset" id="reset" aria-label="Reset timer">↺</button><button class="settings-mini" id="settings" aria-label="Open sound settings" title="Settings">⚙</button></div><button class="back-to-focus" id="backToFocus" hidden>Back to focus</button><button class="focus-view-toggle" id="focusViewToggle" hidden>Show notebook</button></section><section class="tasks" aria-labelledby="tasksHeading"><div class="tasks-heading"><div><h2 id="tasksHeading">Study notebook</h2></div><span id="taskProgress" aria-live="polite">0 of 0 done</span></div><form id="taskForm" class="task-form"><input id="taskInput" placeholder="Add a task…" aria-label="New task" maxlength="100" required autocomplete="off"><button type="button" id="addTask" aria-label="Add task" title="Add task">+</button></form><ul id="taskList" class="task-list"></ul><p id="taskEmpty" class="task-empty"></p><button id="clearCompleted" class="clear-completed" hidden>Clear completed</button></section></div><div id="focusSummary" class="focus-summary">0 minutes focused today</div><div class="session"><span id="dots"></span><span id="sessions">0 sessions today</span></div></main><dialog id="prefs"><h2>Settings</h2><p class="settings-row"><label for="sound">Timer sounds</label><input id="sound" type="checkbox" role="switch" checked style="width:22px;height:22px;accent-color:#768668"></p><button id="closeSettings">Done</button></dialog><script>
const $=id=>document.getElementById(id);let mode='focus',minutes={focus:25,break:5},remaining=1500,running=false,end=0,sound=true;let saved;try{saved=JSON.parse(localStorage.getItem('lil-timer')||'{}')}catch{saved={}}let count=saved.date===new Date().toLocaleDateString()?saved.count||0:0;let taskSerial=0;
function newTaskId(){return 'task-'+Date.now().toString(36)+'-'+(++taskSerial)}
let tasks=Array.isArray(saved.tasks)?saved.tasks.filter(t=>t&&typeof t.text==='string').map(t=>({id:t.id||newTaskId(),text:t.text.slice(0,100),done:!!t.done})):saved.task&&typeof saved.task==='string'&&saved.task.trim()?[{id:newTaskId(),text:saved.task.trim().slice(0,100),done:false}]:[];
let activeTaskId=typeof saved.activeTaskId==='string'?saved.activeTaskId:null;
let progressDate=new Date().toLocaleDateString(),focusMs=saved.date===progressDate&&Number.isFinite(saved.focusMs)?Math.max(0,saved.focusMs):0,accountedAt=0,showWorkspace=false,lastTimerSave=0;
function persist(){try{localStorage.setItem('lil-timer',JSON.stringify({date:progressDate,count,tasks,activeTaskId,focusMs,sound,timer:{mode,minutes,remaining,running,end,accountedAt}}))}catch{}}
function accountTime(now=Date.now()){const date=new Date(now).toLocaleDateString();if(date!==progressDate){progressDate=date;count=0;focusMs=0}if(running&&mode==='focus'&&accountedAt){const midnight=new Date(now);midnight.setHours(0,0,0,0);focusMs+=Math.max(0,Math.min(now,end)-Math.max(accountedAt,midnight.getTime()))}if(running)accountedAt=Math.min(now,end)}

function renderCurrentTask(){const current=tasks.find(t=>t.id===activeTaskId&&!t.done),box=$('currentTask');box.replaceChildren();box.hidden=!current;if(current){const caption=document.createElement('small'),name=document.createElement('span');caption.textContent='WORKING ON';name.textContent=current.text;box.append(caption,name)}}
function moveTask(id,targetIndex){const index=tasks.findIndex(t=>t.id===id);if(index<0)return;targetIndex=Math.max(0,Math.min(tasks.length-1,targetIndex));if(index===targetIndex)return;const [task]=tasks.splice(index,1);tasks.splice(targetIndex,0,task);persist();renderTasks()}

function renderTasks(){const list=$('taskList');list.replaceChildren();tasks.forEach((task,index)=>{const row=document.createElement('li');row.dataset.taskId=task.id;row.className='task-row'+(task.done?' completed':'')+(activeTaskId===task.id?' selected-task':'');const check=document.createElement('input'),text=document.createElement('button'),remove=document.createElement('button'),focus=document.createElement('button'),grip=document.createElement('button');check.type='checkbox';check.className='task-check';check.checked=task.done;check.setAttribute('aria-label','Complete '+task.text);check.onchange=()=>{task.done=check.checked;if(task.done){if(activeTaskId===task.id)activeTaskId=null;celebrate(check)}persist();renderTasks()};text.type='button';text.className='task-text-button';text.textContent=task.text;text.title='Click to edit';text.onclick=()=>editTask(task,text);remove.type='button';remove.className='task-delete';remove.textContent='×';remove.setAttribute('aria-label','Delete '+task.text);remove.onclick=()=>{tasks.splice(index,1);if(activeTaskId===task.id)activeTaskId=null;persist();renderTasks();$('taskInput').focus()};focus.type='button';focus.className='task-focus';focus.textContent='◉';focus.disabled=task.done;focus.title=activeTaskId===task.id?'Clear current task':'Work on this';focus.setAttribute('aria-label','Work on '+task.text);focus.setAttribute('aria-pressed',String(activeTaskId===task.id));focus.onclick=()=>{activeTaskId=activeTaskId===task.id?null:task.id;persist();renderTasks()};grip.type='button';grip.className='task-grip';grip.textContent='⋮⋮';grip.setAttribute('aria-label','Reorder '+task.text+' using drag or arrow keys');grip.onkeydown=e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();moveTask(task.id,index+(e.key==='ArrowUp'?-1:1));const moved=Array.from(list.children).find(r=>r.dataset.taskId===task.id);if(moved)moved.querySelector('.task-grip').focus()}};grip.onpointerdown=e=>{if(e.button!==undefined&&e.button!==0)return;e. function addTask(){const input=$('taskInput'),text=input.value.trim();if(!text){input.focus();return}tasks.push({id:newTaskId(),text:text.slice(0,100),done:false});input.value='';persist();renderTasks();input.focus()}
$('addTask').onclick=e=>{e.preventDefault();addTask()};$('taskForm').onsubmit=e=>{e.preventDefault();addTask()};
let celebrationTimeout;
function celebrate(source){playSound('complete');const old=$('celebrationToast');if(old)old.remove();const toast=document.createElement('div');toast.id='celebrationToast';toast.className='celebration-toast';toast.setAttribute('role','status');toast.textContent='✓ One little win. Nice work!';document.body.append(toast);clearTimeout(celebrationTimeout);celebrationTimeout=setTimeout(()=>toast.remove(),1800);if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const box=source.getBoundingClientRect();for(let i=0;i<20;i++){const piece=document.createElement('i');piece.className='confetti-piece';piece.style.left=(box.left+box.width/2)+'px';piece.style.top=(box.top+box.height/2)+'px';piece.style.background=['#819273','#d9957a','#e2c676','#b8b99a'][i%4];piece.style.setProperty('--dx',((Math.random()-.5)*240)+'px');piece.style.setProperty('--dy',(-30-Math.random()*140)+'px');piece.style.setProperty('--spin',((Math.random()-.5)*600)+'deg');document.body.append(piece);setTimeout(()=>piece.remove(),1000)}}
$('clearCompleted').onclick=()=>{tasks=tasks.filter(t=>!t.done);persist();renderTasks()};renderTasks();
function draw(){const n=minutes[mode];$('marks').innerHTML=Array.from({length:29},(_,i)=>{let val=n+(i-14)*5,x=240+(i-14)*58,y=286-Math.pow((x-240)/180,2)*20;if(val<1||val>60)return '';return `<path d="M${x} ${y-18}v6" stroke="#8c493b" opacity=".65"/><text x="${x}" y="${y+3}" text-anchor="middle" fill="#753f34" font-size="19">${val>=1&&val<=60?val:''}</text>`}).join('');$('dial').setAttribute('aria-valuenow',n)}let breathState='';
function renderBreathing(){
 const isBreak=mode==='break',tomato=$('tomato');
 document.body.classList.toggle('break-view',isBreak);
 tomato.classList.toggle('holding-in',isBreak&&running&&((minutes.break*60-(end-Date.now())/1000)%16)>=4&&((minutes.break*60-(end-Date.now())/1000)%16)<8);

 if(state!==breathState){
  const elapsed=running?Math.max(0,minutes.break*60-(end-Date.now())/1000):Math.max(0,minutes.break*60-remaining);
  tomato.style.setProperty('--breath-offset',-(elapsed%16)+'s');
  tomato.classList.toggle('is-breathing',isBreak&&running);
  breathState=state;
 }
 if(isBreak){
  const elapsed=running?Math.max(0,minutes.break*60-(end-Date.now())/1000):0;
  const phase=Math.floor((elapsed%16)/4), count=4-Math.floor(elapsed%4);
  const prompt=running?['Breathe in through your nose','Hold gently','Breathe out through your nose','Rest and hold'][phase]+' · '+count:(remaining<minutes.break*60?'Rest at your own pace':'Ready to breathe?');
  if($('breathingPrompt').textContent!==prompt)$('breathingPrompt').textContent=prompt;
 }
}
function render(){renderBreathing();document.body.classList.toggle('focus-view',running&&mode==='focus'&&!showWorkspace);$('focusViewToggle').hidden=!(running&&mode==='focus');$('focusViewToggle').textContent=showWorkspace?'Return to focus view':'Show notebook';$('focusSummary').textContent=Math.floor(focusMs/60000)+' minute'+(Math.floor(focusMs/60000)===1?'':'s')+' focused today';$('tomato').classList.toggle('is-running',running&&mode==='focus');$('mouth').setAttribute('d',running?'M230 170 Q240 185 250 170':'M232 172 Q240 172 248 172');$('time').textContent=`${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')}`;document.title=`${$('time').textContent} · Lil Timer`;$('start').textContent=running?'Ⅱ  Pause':remaining===minutes[mode]*60?(mode==='focus'?'▶  Let’s focus':'▶  Take a pause'):'▶  Continue';$('dots').innerHTML=Array.from({length:4},(_,i)=>`<i class="dot ${i<(count%4||(count?4:0))?'done':''}" style="display:inline-block;margin-right:5px"></i>`).join('');$('sessions').textContent=`${count} session${count===1?'':'s'} today`}function choose(m){accountTime();mode=m;running=false;end=0;accountedAt=0;showWorkspace=false;remaining=minutes[m]*60;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('selected',b.dataset.mode===m));$('status').textContent=m==='focus'?'READY WHEN YOU ARE':'A LITTLE TIME TO RECHARGE';draw();render();persist()}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>choose(b.dataset.mode));
$('start').onclick=()=>{updateTimer();if(running){accountTime();remaining=Math.max(0,Math.ceil((end-Date.now())/1000));running=false;$('status').textContent='TAKE YOUR TIME'}else{playSound('start');running=true;accountedAt=Date.now();end=accountedAt+remaining*1000;showWorkspace=false;$('status').textContent=mode==='focus'?'ONE THING AT A TIME':'BREATHE. STRETCH. UNWIND.'}render();persist()};$('reset').onclick=()=>choose(mode);$('backToFocus').onclick=()=>choose('focus');$('focusViewToggle').onclick=()=>{showWorkspace=!showWorkspace;render()};
let audioContext=null;
function unlockAudio(){if(!sound)return null;try{if(!audioContext)audioContext=new (window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});return audioContext}catch{return null}}
function playSound(kind){if(!sound)return;const a=unlockAudio();if(!a)return;const notes=kind==='tick'?[[920,0,.035]]:kind==='start'?[[392,0,.13],[523.25,.12,.23]]:kind==='complete'?[[659.25,0,.18],[783.99,.09,.2],[1046.5,.2,.4]]:[[523.25,0,.45],[659.25,.18,.45],[783.99,.36,.75]];for(const [frequency,delay,duration] of notes){const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;o.type=kind==='tick'?'triangle':'sine';o.frequency.setValueAtTime(frequency,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(kind==='tick'?.035:.09,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+duration+.02)}}
function chime(){playSound('finish')}

setInterval(updateTimer,200);
let dragging=false,startX,initial;function change(n){if(running)return;const next=Math.min(60,Math.max(5,n));if(next===minutes[mode])return;minutes[mode]=next;playSound('tick');remaining=minutes[mode]*60;draw();render();persist()}$('dial').onpointerdown=e=>{e.preventDefault();unlockAudio();if(running)return;dragging=true;startX=e.clientX;initial=minutes[mode];$('dial').setPointerCapture(e.pointerId)};$('dial').onpointermove=e=>{if(dragging)change(initial+Math.round((startX-e.clientX)/24)*5)};$('dial').onpointerup=()=>dragging=false;$('dial').onpointercancel=()=>dragging=false;$('dial').onkeydown=e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();change(minutes[mode]+(['ArrowRight','ArrowUp'].includes(e.key)?5:-5))}};function restoreTimer(){if(typeof saved.sound==='boolean')sound=saved.sound;const t=saved.timer;if(!t||!['focus','break'].includes(t.mode))return;mode=t.mode;for(const m of ['focus','break'])if(Number.isFinite(t.minutes?.[m]))minutes[m]=Math.min(60,Math.max(5,t.minutes[m]));remaining=Number.isFinite(t.remaining)?Math.max(0,Math.min(3600,t.remaining)):minutes[mode]*60;running=t.running===true&&Number.isFinite(t.end)&&Number.isFinite(t.accountedAt)&&t.accountedAt>0;end=running?t.end:0;accountedAt=running?t.accountedAt:0;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('selected',b.dataset.mode===mode));$('status').textContent=running?(mode==='focus'?'ONE THING AT A TIME':'BREATHE. STRETCH. UNWIND.'):'READY WHEN YOU ARE'}
